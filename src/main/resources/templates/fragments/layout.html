<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Asistente documental'">Asistente documental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<header th:fragment="header(active)" class="site-header">
    <a class="brand" th:href="@{/chat}" aria-label="Asistente documental, inicio">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="5" y="3" width="18" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="23" y="8" width="5" height="6" rx="1" fill="currentColor"/>
            <line x1="9" y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="2"/>
            <line x1="9" y1="15" x2="19" y2="15" stroke="currentColor" stroke-width="2"/>
            <line x1="9" y1="20" x2="15" y2="20" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Asistente documental</span>
    </a>
    <nav class="site-nav" aria-label="Navegación principal">
        <a th:href="@{/chat}" th:classappend="${active == 'chat'} ? 'is-active'"
           th:attr="aria-current=${active == 'chat'} ? 'page' : null">Preguntar</a>
        <a th:href="@{/documents}" th:classappend="${active == 'documents'} ? 'is-active'"
           th:attr="aria-current=${active == 'documents'} ? 'page' : null">Documentos</a>
    </nav>
</header>

<div th:fragment="alerts" class="alerts">
    <p th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}">Mensaje</p>
    <p th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}">Error</p>
</div>

</body>
</html>
